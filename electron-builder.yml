appId: com.mygame.embercrestrising
productName: Embercrest Rising

directories:
  output: build-electron
  buildResources: resources

files:
  - "build/**/*"
  - "main.js"
  - "package.json"
  - "favicon.png"

extraFiles:
  - from: "CREDITS.txt"
    to: "CREDITS.txt"

win:
  target:
    - target: nsis
  icon: resources/icon.ico
  executableName: "Embercrest Rising"
  cscLink: null
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: false
  shortcutName: "Embercrest Rising"
